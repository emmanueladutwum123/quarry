name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # Apple's "gcc" is a clang shim, so that leg would duplicate the clang one
          # while claiming coverage it does not have.
          - os: macos-latest
            compiler: gcc
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc CXX=g++
          else
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DQUARRY_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ./build/tests/quarry_tests

  sanitizers:
    name: sanitizer / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQUARRY_WERROR=ON \
            -DQUARRY_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          # halt_on_error makes the first report the exit code; without it a
          # sanitizer finding prints and the job still passes.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/tests/quarry_tests
